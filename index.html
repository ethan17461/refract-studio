  <section class="composer" aria-label="商品信息">
    <div class="row product">
      <label class="field pname"><em>选商品</em><input id="product" type="text" maxlength="100" autocomplete="off" spellcheck="false" placeholder="比如：保温杯" /></label>
      <label class="field pinfo"><em>商品信息<b>必填</b></em><textarea id="info" rows="1" maxlength="3000" spellcheck="false" placeholder="规格、价格、卖点、材质……贴进来就行"></textarea></label>
    </div>
    <div class="row two">
      <label class="field"><em>卖给谁</em><input id="prompt" type="text" maxlength="60" autocomplete="off" spellcheck="false" placeholder="比如：养猫的租房年轻人" /></label>
      <label class="field small"><em>活动</em><input id="campaign" type="text" maxlength="20" autocomplete="off" spellcheck="false" placeholder="比如：双 11" /></label>
    </div>
    <div class="row last">
      <div class="picks">
        <span class="picks-label" id="picks-label">勾选你想生成的</span>
        <div class="pick-row" role="group" aria-labelledby="picks-label" data-name="picks"></div>
      </div>
      <button class="go" type="button" disabled>点亮<kbd>↵</kbd></button>
    </div>
    <details class="shot">
      <summary>视频镜头要求<small>选填，不填就拍最主要的卖点</small></summary>
      <textarea id="shot" maxlength="500" rows="3" placeholder="比如：机器从猫砂盆旁边经过，猫跳开"></textarea>
    </details>
    <details class="shot reference"><summary>商品参考图片网址<small>选填，没有则生成示意图</small></summary><input id="reference-url" type="url" maxlength="500" placeholder="粘贴公开图片网址" /></details>
  </section>

  <ol class="labels" aria-live="polite">
    <li data-beam="0"><b>文案</b><i>COPY</i><em>标题与正文</em></li>
    <li data-beam="1"><b>配图</b><i>IMAGE</i><em>封面与内页</em></li>
    <li data-beam="2"><b>视频</b><i>VIDEO</i><em>竖屏短片</em></li>
  </ol>

  <div class="after">
    <button type="button" class="again">选择其他产品</button>
  </div>
  <button type="button" class="skip">跳过动画</button>
  <dialog class="keybox">
    <form method="dialog">
      <b>真跑要用 Dify 应用钥匙</b>
      <p>只存在这台电脑的浏览器里，不会写进网页代码。钥匙以 app- 开头。</p>
      <input name="key" type="password" autocomplete="off" spellcheck="false" placeholder="app-…" />
      <div><button value="cancel" type="submit">先不用</button><button value="ok" type="submit" class="ok">保存，开始真跑</button></div>
    </form>
  </dialog>
  <div class="note" role="status"></div>

</body>
</html>
